services:
  # ============================================================
  # AgriNexus Backend — Express + Socket.IO API Server
  # Deploy: https://dashboard.render.com → New → Blueprint
  # ============================================================
  - type: web
    name: agrinexus-backend
    runtime: node
    region: singapore   # Closest to India; change to oregon/frankfurt if needed
    plan: free          # Upgrade to starter for always-on (no cold starts)
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health

    # ──────────────────────────────────────────────────────────
    # Environment Variables
    # Values marked `generateValue: true` are auto-generated by Render.
    # Values marked `sync: false` must be set manually in the Render dashboard.
    # ──────────────────────────────────────────────────────────
    envVars:
      # Runtime
      - key: NODE_ENV
        value: production

      # FRONTEND_URL — Set this AFTER your Vercel deploy is live
      # e.g. https://agrinexus.vercel.app
      - key: FRONTEND_URL
        sync: false

      # CORS_ORIGINS — Same as FRONTEND_URL (comma-separated if multiple)
      # e.g. https://agrinexus.vercel.app,https://agrinexus-git-main-youruser.vercel.app
      - key: CORS_ORIGINS
        sync: false

      # SOCKET_CORS_ORIGINS — Same as CORS_ORIGINS for Socket.IO
      - key: SOCKET_CORS_ORIGINS
        sync: false

      # Database — MongoDB Atlas connection URI (SECRET)
      - key: MONGODB_URI
        sync: false

      # JWT Secret — min 32 chars, use a strong random string (SECRET)
      - key: JWT_SECRET
        generateValue: true   # Render generates a secure random value automatically

      # JWT Expiry
      - key: JWT_EXPIRES_IN
        value: 24h

      # Demo Admin Credentials
      - key: ADMIN_EMAIL
        value: admin@agrinexus.gov.in

      # Admin password — set in Render dashboard (SECRET)
      - key: ADMIN_PASSWORD
        sync: false

      # Payment mode (SIMULATED | DEMO | PRODUCTION)
      - key: PAYMENT_MODE
        value: SIMULATED

      # Bhashini APIs — optional, set in Render dashboard if needed
      - key: BHASHINI_API_KEY
        sync: false
      - key: BHASHINI_USER_ID
        sync: false
      - key: BHASHINI_PIPELINE_ID
        value: 64392f96daac500b55c543d6
      - key: BHASHINI_API_URL
        value: https://dhruva-api.bhashini.gov.in/services/inference/pipeline

      # Google Maps API (backend) — optional
      - key: GOOGLE_MAPS_API_KEY
        sync: false
